name: Automated Testing CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-test:
    name: Backend Integration Tests (Supertest & Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root & Backend Dependencies
        run: |
          npm ci || npm install
          cd backend && npm ci || npm install

      - name: Run Backend Integration Tests
        run: |
          cd backend
          npm test

  frontend-test:
    name: Frontend Unit & Component Tests (Vitest & RTL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test

  e2e-test:
    name: End-to-End (E2E) Playwright Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          cd backend && npm install
          cd ../frontend && npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: |
          npm run dev:backend &
          npm run dev:frontend &
          npx wait-on http://localhost:3000 http://localhost:5000 --timeout 60000
          npm run test:e2e
